# Column mapping for the Starburst completed-queries audit table.
#
# Written against a real column list rather than defaults. Two things are
# still unverified and marked below: the units of the columns whose names do
# not carry `_ms`, and whether spill is recorded anywhere outside
# operator_summaries.
#
# Adding a cluster whose schema differs, or absorbing an upgrade that renames
# a column, is an edit here -- not a code change. A field with no column is
# left None, the detectors that need it are skipped, and the skip is reported
# in coverage. So a wrong guess degrades the analysis; it never corrupts it.

name: sep_event_logger
description: >-
  Starburst event-logger completed_queries, as deployed on this fleet.
  Carries per-operator statistics, so the full detector set is available.

table:
  catalog: "${AUDIT_CATALOG}"
  schema: "${AUDIT_SCHEMA}"
  name: completed_queries

# One table holds many clusters; this column says which.
cluster_column: environment

columns:
  query_id: query_id
  state: query_state
  sql: query
  # `user` is reserved in most engines, so the column is `usr`.
  user: usr
  session_catalog: catalog
  session_schema: schema

  elapsed_ms: wall_time_ms
  queued_ms: queued_time_ms
  cpu_ms: cpu_time_ms

  # These carry no `_ms` suffix. If they are Trino Duration strings ("1.32s")
  # rather than integer milliseconds, map them as null until the loader is
  # taught to read that format -- a duration read as a millisecond count would
  # be wrong by three orders of magnitude, which is worse than absent.
  planning_ms: null
  execution_ms: null

  # Trino reports several peaks. User memory is the one query limits are
  # enforced against, so it is the one worth comparing to those limits.
  peak_memory_bytes: peak_user_memory_bytes

  total_bytes_scanned: total_bytes
  total_rows: total_rows
  output_bytes: output_bytes
  written_rows: written_rows
  written_bytes: written_bytes
  completed_splits: completed_splits

  # Bytes actually read from storage, as distinct from total_bytes which
  # includes data read between stages. The better denominator for judging
  # whether a scan was larger than the result justified.
  physical_input_bytes: physical_input_bytes
  physical_input_rows: physical_input_rows

  # Shuffle volume. A broadcast join that should have been partitioned shows
  # up here long before it shows up in wall time.
  internal_network_bytes: internal_network_bytes

  # This table has no output_rows column -- only output_bytes. Amplification
  # is therefore measured in bytes read per byte returned.
  output_rows: null

  # Failure detail is one structured column, not a code and a message.
  error_info: failure_info

  started_at: create_time
  ended_at: end_time

  # Not present at the top level. Trino records spill per operator, so it is
  # expected inside operator_summaries rather than as its own column.
  spilled_bytes: null

# The full per-operator statistics payload. Its presence is what makes skew,
# join explosion, broadcast sizing and dynamic-filter effectiveness knowable
# at all -- without it only the query-level detectors can run.
payload:
  column: operator_summaries
  format: json_array_of_strings

# Additional structured columns, read alongside the payload.
extra_payloads:
  stages: stages
  cpu_time_distribution: cpu_time_distribution
  plan_node_stats_and_costs: plan_node_stats_and_costs
  stage_gc_statistics: stage_gc_statistics
  accessed_metadata: accessed_metadata

state_values:
  finished: [FINISHED, SUCCEEDED, DONE]
  failed: [FAILED, ERROR]
  cancelled: [CANCELLED, CANCELED, ABORTED, KILLED]
  running: [RUNNING, EXECUTING]
  queued: [QUEUED, WAITING]
