# Node identity rules.
#
# These are the fleet-drift checks that per-node backup directories exist to
# make possible. They cannot be expressed as a single-property threshold: the
# defect is disagreement between nodes, and each individual value looks fine.

- id: SEP-NODE-001
  domain: node_identity
  label: "cluster name each node reports"
  summary: >-
    Some nodes report a different cluster name from the rest, so they will
    not join the cluster
  consistency:
    kind: equal_across_nodes
    property: node.environment
  severity: high
  next_step: >-
    Set node.environment to the same value on every node in the role. A node that differs never joins the cluster.
  rationale: >-
    Nodes only join a cluster when node.environment matches exactly. A node
    with a different value silently forms its own cluster of one and never
    appears as a worker, while looking healthy in isolation.
  applies_to:
    roles: [coordinator, worker]

- id: SEP-NODE-002
  domain: node_identity
  label: "cluster name each node reports"
  summary: >-
    The coordinator and its workers report different cluster names, so no
    worker can join and every query will queue
  consistency:
    kind: equal_across_roles
    property: node.environment
  severity: critical
  next_step: >-
    Make node.environment identical on the coordinator and every worker, then restart. Until it matches, workers never register and every query queues forever.
  rationale: >-
    A coordinator and its workers must share node.environment. When they
    differ the workers never register and the cluster runs with no capacity,
    which presents to users as every query queueing forever.
  applies_to:
    roles: [coordinator, worker]

- id: SEP-NODE-003
  domain: node_identity
  label: "cluster name each node reports"
  property: node.environment
  check:
    kind: matches
    pattern: "^[a-z0-9][a-z0-9_]*$"
  on_missing: fail
  severity: medium
  next_step: >-
    Change node.environment to lowercase alphanumeric with underscores only. Hyphens and capitals are rejected at startup.
  rationale: >-
    node.environment must be lowercase alphanumeric with underscores. Values
    containing hyphens or uppercase characters are rejected at startup.
  applies_to:
    roles: [coordinator, worker]

- id: SEP-NODE-004
  domain: node_identity
  label: "directory Starburst writes its working data to"
  property: node.data-dir
  summary: >-
    No working directory is configured, so Starburst may fail to start on a
    node that cannot write to the default location
  check:
    kind: required
  on_missing: fail
  severity: medium
  next_step: >-
    Set node.data-dir to a path on a writable mounted volume. The container runs as a random UID and cannot write to the image's default location.
  rationale: >-
    Under OpenShift the container runs as a random UID and cannot write to a
    default path under the image's home directory. An explicit data directory
    on a writable mount avoids a startup failure that only appears in the
    cluster, never in local testing.
  applies_to:
    roles: [coordinator, worker]
