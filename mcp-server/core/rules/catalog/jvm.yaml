# JVM rules, evaluated against normalised jvm.config flags.
#
# The parser rewrites -XX:+Flag as "-XX:Flag = true", so a boolean flag is
# checked with `equals` like any other value.

- id: SEP-JVM-001
  domain: jvm
  label: "maximum Java heap size"
  property: "-Xmx"
  summary: >-
    No maximum Java heap size is set, so each node guesses how much memory
    it may use
  check:
    kind: required
  on_missing: fail
  severity: critical
  next_step: >-
    Add an explicit -Xmx to jvm.config sized to the pod's memory limit. Without it the JVM guesses, and under OpenShift it usually guesses wrong.
  rationale: >-
    Without -Xmx the JVM picks a default from the container's visible memory,
    which under OpenShift is frequently not the limit the pod actually has.
    Every memory rule also divides against this value, so its absence blinds
    the rest of the checks.
  applies_to:
    roles: [coordinator, worker]

- id: SEP-JVM-002
  domain: jvm
  label: "safeguard that shuts a node down if it runs out of memory"
  property: "-XX:ExitOnOutOfMemoryError"
  check:
    kind: equals
    value: "true"
  on_missing: fail
  severity: high
  next_step: >-
    Add -XX:+ExitOnOutOfMemoryError to jvm.config so the orchestrator can restart a node cleanly instead of leaving a half-dead one in the cluster.
  rationale: >-
    A JVM that survives an OutOfMemoryError keeps accepting work while in an
    unrecoverable state. Exiting lets the orchestrator restart the node
    cleanly instead of leaving a zombie worker in the cluster.
  applies_to:
    roles: [coordinator, worker]
    sep_version: ">=413"

- id: SEP-JVM-003
  domain: jvm
  label: "memory dump that would be saved if a node ran out of memory"
  property: "-XX:HeapDumpOnOutOfMemoryError"
  check:
    kind: equals
    value: "true"
  on_missing: skip
  severity: low
  next_step: >-
    Add -XX:+HeapDumpOnOutOfMemoryError to jvm.config, and point the dump path at a writable mounted volume.
  rationale: >-
    Without a heap dump an out-of-memory incident leaves nothing to diagnose
    afterwards, and the condition is rarely reproducible on demand.
  applies_to:
    roles: [coordinator, worker]

- id: SEP-JVM-004
  domain: jvm
  label: "garbage collector region size"
  property: "-XX:G1HeapRegionSize"
  check:
    kind: range
    min: 16M
    max: 64M
  on_missing: skip
  severity: low
  next_step: >-
    Set -XX:G1HeapRegionSize between 16M and 64M in jvm.config.
  rationale: >-
    Very small G1 regions increase collection overhead on large heaps; very
    large ones waste space through humongous-allocation rounding.
  applies_to:
    roles: [coordinator, worker]

- id: SEP-JVM-005
  domain: jvm
  label: "Java heap size"
  summary: >-
    Worker nodes are running with different amounts of memory, so the
    smallest one limits every query
  consistency:
    kind: equal_across_nodes
    property: "-Xmx"
  severity: medium
  next_step: >-
    Align -Xmx across all workers. One smaller node becomes the bottleneck for every distributed query.
  rationale: >-
    Workers in a fleet are expected to be identically sized. One node with a
    smaller heap becomes the bottleneck for every distributed query and shows
    up as unexplained skew.
  applies_to:
    roles: [worker]
